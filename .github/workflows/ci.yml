name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build private runtime
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.20.0
          python scripts/build-bundled-runtime.py --output build/runtime-dist
      - name: Configure
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DPKMN_BUNDLED_RUNTIME_EXECUTABLE=${{ github.workspace }}/build/runtime-dist/pkmn-runtime/pkmn-runtime
      - name: Build
        run: cmake --build build/release --parallel
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
      - name: Install
        run: cmake --install build/release --prefix "$RUNNER_TEMP/pkmn-install"
      - name: Installed CLI smoke test
        run: scripts/verify-installed-package.sh "$RUNNER_TEMP/pkmn-install"

  windows-build-test-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build private runtime
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.20.0
          python scripts/build-bundled-runtime.py --output build/runtime-dist
      - name: Configure
        run: >-
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DPKMN_BUNDLED_RUNTIME_EXECUTABLE=${{ github.workspace }}/build/runtime-dist/pkmn-runtime/pkmn-runtime.exe
      - name: Build
        run: cmake --build build/release --config Release --parallel
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Install
        run: cmake --install build/release --config Release --prefix "${{ runner.temp }}/pkmn-install"
      - name: Installed CLI smoke test
        shell: pwsh
        run: |
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" --help
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" --version
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" doctor --deep
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" convert routes --format json
          $work = Join-Path "${{ runner.temp }}" "pkmn-installed-smoke"
          New-Item -ItemType Directory -Force $work | Out-Null
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" red repair-checksums "${{ runner.temp }}/pkmn-install/share/pkmn/resources/pokemon-red-usa-europe-v1.template.bin" --output "$work/source.sav"
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" red decode "$work/source.sav" --output "$work/source.red.json"
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" rjson convert_to_frjson "$work/source.red.json" "$work/target.fred.json"
          & "${{ runner.temp }}/pkmn-install/bin/pkmn.exe" frjson validate "$work/target.fred.json"
